name: Push to Dockerhub

on:
  push:
    branches:
      - main

jobs:
  # Publishing runs the gate itself rather than trusting a separate workflow.
  # `maifeeulasad/fluid-builder:latest` is the base image for every example,
  # so a broken push propagates immediately and silently.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Fetch dependencies
        run: java DependencyDownloader.java

      - name: Compile
        run: javac -Xlint:all -cp "lib/*" -d out *.java

      - name: Test
        run: mvn -B --no-transfer-progress test

  push-to-dockerhub:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # DEVELOPMENT.md documents date-based and semantic versioning, but the
      # workflow only ever moved `latest`, leaving no tag to roll back to.
      - name: Derive tags
        id: tags
        run: |
          echo "date=v$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Loaded into the local Docker engine rather than pushed, so it can be
      # run for the smoke test below. `--push` with provenance/SBOM produces
      # an image index BuildKit cannot also hand back as a runnable local
      # image in the same invocation.
      - name: Build Docker image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: fluid-builder:ci-smoke
          load: true

      - name: Smoke test before publishing
        run: |
          set -euo pipefail
          # No broker here, so the framework starts, finds no services and
          # waits. Reaching the startup line proves dependency download and
          # compile-from-source both succeeded inside the container, which is
          # the one thing `javac` in the previous job cannot show.
          docker run -d --name fluid-smoke fluid-builder:ci-smoke

          started=false
          for _ in $(seq 1 90); do
            if docker logs fluid-smoke 2>&1 | grep -q "Framework started successfully"; then
              started=true
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' fluid-smoke)" != "true" ]; then
              break
            fi
            sleep 2
          done

          docker logs fluid-smoke 2>&1 | tail -30
          docker rm -f fluid-smoke >/dev/null 2>&1 || true

          if [ "$started" != "true" ]; then
            echo "::error::Image failed its smoke test; refusing to publish."
            exit 1
          fi
          echo "Container started successfully."

      # Re-built (BuildKit cache makes this cheap — same Dockerfile, same
      # context as the smoke-tested build above) and pushed with build
      # provenance and an SBOM attached, so a pulled image can be verified
      # with `docker buildx imagetools inspect` or `docker scout`.
      - name: Build and push with provenance and SBOM attestations
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            maifeeulasad/fluid-builder:latest
            maifeeulasad/fluid-builder:${{ steps.tags.outputs.date }}
            maifeeulasad/fluid-builder:${{ steps.tags.outputs.sha }}
