name: Fluid Builder CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The gate. Everything downstream depends on this passing.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Matches the container base image. The sources are compiled by the
      # container itself at start-up, so building on a newer JDK here would
      # let a construct through that the container cannot compile.
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      # lib/ is gitignored and fetched at runtime, so CI has to populate it
      # the same way the container does.
      - name: Fetch dependencies
        run: java DependencyDownloader.java

      # The step that was missing. The previous workflow only ran
      # `docker build`, which copies sources without compiling them, so a
      # tree with 47 compile errors passed green.
      - name: Compile
        run: javac -Xlint:all -cp "lib/*" -d out *.java

      # examples/ is not part of the shipped artifact, but it is the code
      # users copy from. It went unbuildable for months without anyone
      # noticing, so it is compiled here even though it is not packaged.
      - name: Compile examples
        run: javac -Xlint:all -cp "lib/*:out" -d out-examples examples/*.java

      - name: Test
        run: mvn -B --no-transfer-progress test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  # Proves the source launcher still works, which javac alone cannot show:
  # the image compiles the .java files itself at container start.
  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t fluid-builder -f Dockerfile .

      - name: Smoke test the image
        run: |
          set -euo pipefail
          # No broker here, so the framework starts, finds no services and
          # waits. Reaching the startup line proves dependency download and
          # compile-from-source both succeeded inside the container, which is
          # the one thing `javac` in the previous job cannot show.
          docker run -d --name fluid-smoke fluid-builder

          started=false
          for _ in $(seq 1 90); do
            if docker logs fluid-smoke 2>&1 | grep -q "Framework started successfully"; then
              started=true
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' fluid-smoke)" != "true" ]; then
              break
            fi
            sleep 2
          done

          docker logs fluid-smoke 2>&1 | tail -30
          docker rm -f fluid-smoke >/dev/null 2>&1 || true

          if [ "$started" != "true" ]; then
            echo "::error::Container did not reach startup."
            exit 1
          fi
          echo "Container started successfully."
